name: Refresh concerts and publish Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the refreshed app to GitHub Pages
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: magic-compass-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check collector and recommendation rules
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --test tests/concerts.test.cjs tests/concerts-ui.test.cjs tests/spotify.test.cjs
          node --check concerts.js
          node --check spotify.js
      - name: Retrieve real concerts
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKSTER_API_KEY: ${{ secrets.TICKSTER_API_KEY }}
        run: python scripts/fetch_concerts.py --require-ticketmaster --previous-url https://honkstonk.github.io/concerts.json
      - name: Validate and stage the public app
        run: |
          node -e "require('./concerts-core.js').validateSnapshot(require('./concerts.json'))"
          python scripts/package_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local/site

  deploy:
    if: github.event_name == 'schedule' || inputs.publish
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
